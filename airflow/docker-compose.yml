x-airflow-common: &airflow-common
  image: apache/airflow:2.10.3-python3.12
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ../dbt:/opt/dbt
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy

services:
  airflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Valentin \
          --lastname Ratigniet \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:8090:8080"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "airflow_default"
      traefik.http.routers.http-airflow-projet19.entryPoints: "http"
      traefik.http.routers.http-airflow-projet19.middlewares: "redirect-to-https-airflow-projet19"
      traefik.http.routers.http-airflow-projet19.rule: "Host(`airflow-projet19.76.13.43.130.sslip.io`)"
      traefik.http.routers.http-airflow-projet19.service: "svc-airflow-projet19"
      traefik.http.middlewares.redirect-to-https-airflow-projet19.redirectscheme.scheme: "https"
      traefik.http.routers.https-airflow-projet19.entryPoints: "https"
      traefik.http.routers.https-airflow-projet19.rule: "Host(`airflow-projet19.76.13.43.130.sslip.io`)"
      traefik.http.routers.https-airflow-projet19.service: "svc-airflow-projet19"
      traefik.http.routers.https-airflow-projet19.tls: "true"
      traefik.http.routers.https-airflow-projet19.tls.certresolver: "letsencrypt"
      traefik.http.services.svc-airflow-projet19.loadbalancer.server.port: "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow-postgres-data:
