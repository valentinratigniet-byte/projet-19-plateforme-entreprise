<text x="34" y="102" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="600" letter-spacing="0.4" fill="#1f6f68">DEFINITIONS ET LIMITES -- A LIRE AVANT LE CHIFFRE</text>
<text x="40" y="128.0" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#2b3330">Pas un compte de resultat PCG</text><text x="40" y="143.0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10.5" fill="#6b7a73">grand livre Finance = ecritures fournisseurs (401xxx) seulement, aucune classe 7 ni charges hors achats</text><line x1="40" y1="152.0" x2="960" y2="152.0" stroke="#c7cfc9" stroke-dasharray="1 3"/><text x="40" y="210.0" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#2b3330">HT, pas TTC</text><text x="40" y="225.0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10.5" fill="#6b7a73">la TVA collectee/recuperable n'est pas une charge reelle -- montant_ht_eur, pas montant_ttc_eur</text><line x1="40" y1="234.0" x2="960" y2="234.0" stroke="#c7cfc9" stroke-dasharray="1 3"/><text x="40" y="292.0" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#2b3330">Pas d'entite commune Ventes/Finance</text><text x="40" y="307.0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10.5" fill="#6b7a73">meme limite que la vue transverse -- mise en regard, pas consolidation comptable</text><line x1="40" y1="316.0" x2="960" y2="316.0" stroke="#c7cfc9" stroke-dasharray="1 3"/></svg>