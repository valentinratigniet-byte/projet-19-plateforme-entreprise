name: CI

# Rejoue en local (sur le runner GitHub) le pipeline reellement deploye sur
# le VPS/Coolify : entrepot Postgres + les sources reelles des domaines
# (SQL Server, MySQL, MongoDB, Firebird, mock SaaS) -- pas de simulation
# partielle. Mots de passe ci-dessous valables uniquement le temps du run
# (conteneurs jetables), jamais ceux utilises en production.

on:
  push:
  pull_request:

env:
  PG_SUPERUSER_PASSWORD: ci-superuser-pw
  INGESTION_PASSWORD: ci-ingestion-pw
  DBT_PASSWORD: ci-dbt-pw
  SA_PASSWORD: "CIpassw0rd!2026"
  MYSQL_ROOT_PASSWORD: ci-mysql-pw
  SAAS_CLIENT_SECRET: ci-saas-secret
  MONGO_ROOT_PASSWORD: ci-mongo-pw
  FIREBIRD_ROOT_PASSWORD: ci-firebird-pw

jobs:
  plateforme-entreprise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer libfbclient2 (bibliotheque cliente native requise par firebird-driver, cf. ingestion/Dockerfile)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfbclient2

      - name: Installer les dependances (ingestion + dbt + saas-mock)
        run: |
          pip install -r ingestion/requirements.txt dbt-postgres
          pip install -r domaines/marketing-activite/saas-mock/requirements.txt

      - name: Substituer les mots de passe placeholders (entrepot/init)
        run: |
          sed -i "s/__INGESTION_PASSWORD__/${INGESTION_PASSWORD}/" entrepot/init/01_schema_raw.sql
          sed -i "s/__DBT_PASSWORD__/${DBT_PASSWORD}/" entrepot/init/01_schema_raw.sql

      - name: Demarrer l'entrepot (Postgres)
        working-directory: entrepot
        env:
          PG_SUPERUSER: postgres
        run: docker compose up -d --wait --wait-timeout 60

      - name: Demarrer la source Finance (SQL Server)
        working-directory: domaines/finance-compta/source
        run: docker compose up -d --wait --wait-timeout 180

      - name: Demarrer la source Marketing (MySQL)
        working-directory: domaines/marketing-activite/source
        run: docker compose up -d --wait --wait-timeout 120

      - name: Demarrer la source Support Client (MongoDB)
        working-directory: domaines/support-client/source
        run: docker compose up -d --wait --wait-timeout 120

      - name: Demarrer la source Inventaire/Stock (Firebird)
        working-directory: domaines/inventaire-stock/source
        run: docker compose up -d --wait --wait-timeout 120

      - name: Generer les sources synthetiques (gitignorees, deterministes -- seed fixe)
        run: |
          cd domaines/ventes-commerce/source && python simulateur_as400.py && python simulateur_excel_remises.py && cd -
          cd domaines/finance-compta/source && python generer_evenements.py && python simulateur_csv_banque.py && python simulateur_facturx.py && cd -
          cd domaines/marketing-activite/source && python generer_evenements.py && python simulateur_evenements_json.py && cd -

      - name: Peupler SQL Server (fournisseurs + ecritures)
        working-directory: domaines/finance-compta/source
        env:
          MSSQL_HOST: localhost
          MSSQL_PORT: "1433"
          MSSQL_SA_PASSWORD: ${{ env.SA_PASSWORD }}
        run: python simulateur_sqlserver.py

      - name: Peupler MySQL (contacts + campagnes + envois)
        working-directory: domaines/marketing-activite/source
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: "3306"
        run: python simulateur_mysql.py

      - name: Peupler MongoDB (tickets SAV)
        working-directory: domaines/support-client/source
        env:
          MONGO_HOST: localhost
          MONGO_PORT: "27017"
          MONGO_ROOT_PASSWORD: ${{ env.MONGO_ROOT_PASSWORD }}
        run: python simulateur_mongodb.py

      - name: Peupler Firebird (articles + mouvements de stock)
        working-directory: domaines/inventaire-stock/source
        env:
          FIREBIRD_HOST: localhost
          FIREBIRD_PORT: "3050"
          FIREBIRD_ROOT_PASSWORD: ${{ env.FIREBIRD_ROOT_PASSWORD }}
        run: python simulateur_firebird.py

      - name: Demarrer le mock SaaS marketing
        working-directory: domaines/marketing-activite/saas-mock
        env:
          SAAS_CLIENT_ID: projet19
        run: |
          docker compose up -d --build
          for i in $(seq 1 20); do
            curl -sf http://localhost:5000/health && exit 0
            sleep 2
          done
          echo "mock SaaS jamais devenu pret" >&2
          exit 1

      - name: Creer les roles RLS specifiques aux domaines (Ventes, Marketing, Support Client, Inventaire/Stock)
        # Le GRANT USAGE ON SCHEMA marts de marketing/rls.sql doit attendre
        # que dbt ait cree le schema marts (etape suivante) -- seul le
        # CREATE ROLE (necessaire aux post_hook de "dbt run") est fait ici.
        env:
          PGPASSWORD: ${{ env.PG_SUPERUSER_PASSWORD }}
        run: |
          psql -h localhost -p 5440 -U postgres -d projet19 -v ON_ERROR_STOP=1 -f domaines/ventes-commerce/rls.sql
          psql -h localhost -p 5440 -U postgres -d projet19 -v ON_ERROR_STOP=1 -c "CREATE ROLE role_marketing NOLOGIN;"
          psql -h localhost -p 5440 -U postgres -d projet19 -v ON_ERROR_STOP=1 -f domaines/support-client/rls.sql
          psql -h localhost -p 5440 -U postgres -d projet19 -v ON_ERROR_STOP=1 -f domaines/inventaire-stock/rls.sql

      - name: Ingerer le domaine Ventes/Commerce (AS/400 + Excel, deja committes)
        working-directory: domaines/ventes-commerce
        env:
          PYTHONPATH: ${{ github.workspace }}/ingestion
          PGHOST: localhost
          PGPORT: "5440"
          PGDATABASE: projet19
          PGUSER: ingestion
          PGPASSWORD: ${{ env.INGESTION_PASSWORD }}
        run: python ingestion.py

      - name: Ingerer le domaine Finance/Compta (SQL Server + CSV + Factur-X)
        working-directory: domaines/finance-compta
        env:
          PYTHONPATH: ${{ github.workspace }}/ingestion
          PGHOST: localhost
          PGPORT: "5440"
          PGDATABASE: projet19
          PGUSER: ingestion
          PGPASSWORD: ${{ env.INGESTION_PASSWORD }}
          MSSQL_HOST: localhost
          MSSQL_PORT: "1433"
          MSSQL_SA_PASSWORD: ${{ env.SA_PASSWORD }}
        run: python ingestion.py

      - name: Ingerer le domaine Marketing/Activite (MySQL + JSON + API SaaS)
        working-directory: domaines/marketing-activite
        env:
          PYTHONPATH: ${{ github.workspace }}/ingestion
          PGHOST: localhost
          PGPORT: "5440"
          PGDATABASE: projet19
          PGUSER: ingestion
          PGPASSWORD: ${{ env.INGESTION_PASSWORD }}
          MYSQL_HOST: localhost
          MYSQL_PORT: "3306"
          SAAS_BASE_URL: http://localhost:5000
          SAAS_CLIENT_ID: projet19
        run: python ingestion.py

      - name: Ingerer le domaine Support Client (MongoDB)
        working-directory: domaines/support-client
        env:
          PYTHONPATH: ${{ github.workspace }}/ingestion
          PGHOST: localhost
          PGPORT: "5440"
          PGDATABASE: projet19
          PGUSER: ingestion
          PGPASSWORD: ${{ env.INGESTION_PASSWORD }}
          MONGO_HOST: localhost
          MONGO_PORT: "27017"
          MONGO_ROOT_PASSWORD: ${{ env.MONGO_ROOT_PASSWORD }}
        run: python ingestion.py

      - name: Ingerer le domaine Inventaire/Stock (Firebird)
        working-directory: domaines/inventaire-stock
        env:
          PYTHONPATH: ${{ github.workspace }}/ingestion
          PGHOST: localhost
          PGPORT: "5440"
          PGDATABASE: projet19
          PGUSER: ingestion
          PGPASSWORD: ${{ env.INGESTION_PASSWORD }}
          FIREBIRD_HOST: localhost
          FIREBIRD_PORT: "3050"
          FIREBIRD_ROOT_PASSWORD: ${{ env.FIREBIRD_ROOT_PASSWORD }}
        run: python ingestion.py

      - name: dbt seed + snapshot + run + test (staging -> marts, RLS en post_hook)
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
          PGHOST: localhost
          PGPORT: "5440"
          PGUSER: dbt_transform
          PGPASSWORD: ${{ env.DBT_PASSWORD }}
          PGDATABASE: projet19
          PGSSLMODE: prefer
        run: |
          dbt seed
          dbt snapshot
          dbt run
          dbt test

      - name: Completer les GRANT USAGE sur marts (schema cree par dbt run juste au-dessus)
        env:
          PGPASSWORD: ${{ env.PG_SUPERUSER_PASSWORD }}
        run: |
          psql -h localhost -p 5440 -U postgres -d projet19 -v ON_ERROR_STOP=1 -f entrepot/grants_marts_partages.sql
          psql -h localhost -p 5440 -U postgres -d projet19 -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA marts TO role_marketing;"

      - name: Verifier la RLS reellement (SET ROLE, 5 domaines)
        env:
          PGHOST: localhost
          PGPORT: "5440"
          PGDATABASE: projet19
          PGSUPERUSER: postgres
          PGSUPERUSER_PASSWORD: ${{ env.PG_SUPERUSER_PASSWORD }}
        run: |
          python domaines/ventes-commerce/test_rls.py
          python domaines/finance-compta/test_rls.py
          python domaines/marketing-activite/test_rls.py
          python domaines/support-client/test_rls.py
          python domaines/inventaire-stock/test_rls.py

      - name: Demarrer un recepteur de webhook (equivalent CI du conteneur webhook-echo manuel, cf. docs/guide-realisation.md)
        # Le mock SaaS appelle webhook-echo:5001 depuis SON reseau Docker
        # (celui cree par le docker-compose de saas-mock) -- le recepteur
        # doit donc etre un conteneur sur ce meme reseau, pas un process
        # cote hote (les deux ne partagent pas la resolution DNS).
        run: |
          NETWORK=$(docker network ls --filter name=saas-mock --format '{{.Name}}' | head -1)
          docker run -d --rm --name webhook-echo --network "$NETWORK" python:3.12-slim python3 -c '
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  self.send_response(200)
                  self.end_headers()
              def log_message(self, *a): pass
          HTTPServer(("0.0.0.0", 5001), H).serve_forever()
          '
          for i in $(seq 1 15); do
            docker exec projet19-saas-mock python3 -c "import urllib.request; urllib.request.urlopen('http://webhook-echo:5001/', data=b'', timeout=2)" && exit 0
            sleep 1
          done
          echo "recepteur webhook jamais joignable depuis le mock SaaS" >&2; exit 1

      - name: Verifier les 4 mecanismes SaaS (polling, refresh OAuth2, webhook, reverse ETL)
        working-directory: domaines/marketing-activite
        env:
          PYTHONPATH: ${{ github.workspace }}/ingestion
          SAAS_BASE_URL: http://localhost:5000
          SAAS_CLIENT_ID: projet19
        run: python test_saas_integration.py
