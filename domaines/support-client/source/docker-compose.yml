services:
  mongodb:
    image: mongo:8
    container_name: projet19-mongodb
    # Plafond explicite -- MongoDB dimensionne son cache WiredTiger a 50%
    # de (RAM hote - 1 Go) par defaut, ce qui suppose implicitement qu'il
    # est seul sur la machine. Faux ici (SQL Server + MySQL + Postgres +
    # Airflow + n8n tournent deja) : sans plafond, chaque nouveau conteneur
    # "voit" la RAM totale de l'hote et sur-dimensionne son propre cache.
    mem_limit: 512m
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: support_client
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongodb-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mongodb-data:
