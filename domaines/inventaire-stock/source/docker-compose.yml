services:
  firebird:
    image: firebirdsql/firebird:5
    container_name: projet19-firebird
    # Plafond explicite, meme discipline que MongoDB (support-client) --
    # Firebird embarque est concu pour tourner sans admin dedie, sobre par
    # defaut, mais sur un VPS deja charge (SQL Server + MySQL + MongoDB +
    # Postgres + Airflow + n8n) autant le garantir plutot que le supposer.
    mem_limit: 256m
    environment:
      FIREBIRD_ROOT_PASSWORD: ${FIREBIRD_ROOT_PASSWORD}
      FIREBIRD_DATABASE: inventaire.fdb
    volumes:
      - firebird-data:/var/lib/firebird/data
    ports:
      - "127.0.0.1:3050:3050"
    healthcheck:
      # 2 bugs reels trouves en testant : (1) "isql-fb" n'existe pas dans
      # cette image, le binaire reel est /opt/firebird/bin/isql, absent
      # du PATH par defaut ; (2) "rdb$database" (un seul $) est interprete
      # par docker compose LUI-MEME comme sa propre variable "$database"
      # (substituee par une chaine vide -- table "RDB" alors introuvable),
      # avant meme d'atteindre le shell du conteneur -- $$ echappe le $
      # pour compose, la string entre quotes simples protege ensuite du
      # shell du conteneur.
      test: ["CMD-SHELL", "echo 'select 1 from rdb$$database;' | /opt/firebird/bin/isql -user SYSDBA -password \"$$FIREBIRD_ROOT_PASSWORD\" /var/lib/firebird/data/inventaire.fdb || exit 1"]
      interval: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  firebird-data:
