        description: "Copie brute des mouvements de stock Firebird (état courant complet, remplacé à chaque run) -- DATE_MVT nu, sans fuseau (horodatage scanner local)."
        loaded_at_field: _ingested_at
        freshness:
          warn_after: {count: 1, period: day}
          error_after: {count: 2, period: day}
