version: 2

models:
  - name: dim_contact
    description: "Contacts -- accès restreint à role_marketing uniquement (donnée personnelle, role_direction non habilité)."
    columns:
      - name: contact_id
        tests: [not_null, unique]

  - name: fait_envois
    description: "Une ligne = un envoi. Contrat de schéma figé (consommé par la connectique BI)."
    config:
      contract: {enforced: true}
    columns:
      - name: envoi_id
        data_type: integer
        tests: [not_null, unique]
      - name: contact_id
        data_type: integer
      - name: contact_connu
        data_type: boolean
      - name: campagne_id
        data_type: integer
      - name: campagne_nom
        data_type: text
      - name: date_envoi
        data_type: date
      - name: statut
        data_type: text

  - name: fait_evenements_web
    columns:
      - name: session_id
        tests: [not_null]

  - name: fait_performance_campagnes
    description: "Mart agrégé (pas de contact individuel) -- accessible à role_direction, contrairement aux autres marts du domaine."
    columns:
      - name: campagne_id
        tests: [not_null, unique]
      - name: coherent_avec_mysql
        tests:
          - accepted_values:
              values: [true, false]
