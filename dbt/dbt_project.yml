name: "projet19_plateforme_entreprise"
version: "1.0.0"
config-version: 2

profile: "projet19"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  projet19_plateforme_entreprise:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

seeds:
  projet19_plateforme_entreprise:
    # dbt_transform ne possede pas le schema raw (role ingestion) --
    # les seeds (hypotheses labellisees, ex. budget) vivent a cote des
    # marts qui les consomment, pas dans raw (elles ne sont pas une
    # source ingeree).
    +schema: marts
